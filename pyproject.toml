[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "myosuite_mjlab"
version = "0.1.0"
description = "Minimal MyoSuite task integration package for mjlab"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "mjlab",
  "mujoco>=3.2",
  "torch",
  "rsl-rl-lib",
  "pytest>=9.0.2",
  "myosuite",
  "pre-commit>=4.5.1",
]

[project.scripts]
mjlab-train = "myosuite_mjlab.scripts.train:main"
mjlab-play = "myosuite_mjlab.scripts.play:main"

[dependency-groups]
dev = [
  "pyright>=1.1.408",
  "ruff>=0.14.14",
]

[tool.uv]
override-dependencies = [
  "h5py>=3.12.0",
  "cloudpickle>=3.0.0",
  # Pin to 3.4.x so MjData layout matches mujoco-warp (3.5.x changed flexedge fields).
  "mujoco>=3.4.0,<3.5",
]

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv.sources]
# Use local mjlab (has tasks.registry and full task stack). Omit or switch to pypi for a pure pip install.
mjlab = { path = "../mjlab", editable = true }
myosuite = { git = "https://github.com/MyoHub/myosuite.git", rev = "mjx" }
# Resolve mujoco from py.mujoco.org so version matches mujoco-warp (avoids flexedge_J_rownnz ABI error).
mujoco = { index = "mujoco" }

[tool.hatch.build.targets.wheel]
packages = ["src/myosuite_mjlab"]

[tool.ruff]
line-length = 88

[tool.pyright]
# Relax so pre-commit passes; mjlab/mujoco and dataclass configs are typed at runtime.
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
reportOptionalOperand = "warning"
reportUndefinedVariable = "warning"
